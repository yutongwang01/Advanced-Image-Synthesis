[package]
name = "gauchort"
version = "0.1.0"
edition = "2021"
description = "ECE/CS 285 HW2 to HW4: gauchoRT, a ray tracer in Rust, driven by the C++ scene files"
build = "build.rs"

[[bin]]
name = "gauchoRT"
path = "src/main.rs"

[dependencies]
# The Rust counterpart of stb_image and stb_image_write: reads textures
# (PNG, JPEG, BMP, TGA, HDR) and writes the PNG or JPEG, in the given
# src/image.rs and src/texture.rs. PFM is read and written by hand (a few
# lines).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "hdr"] }
# The tile pool: rayon's scope or par_iter over the tiles stands in for
# std::thread and the atomic counter of the C++ kit; std::thread is fine too.
rayon = "1.10"

[build-dependencies]
# build.rs compiles the C++ scene files with it.
cc = "1"

[profile.dev]
# A ray tracer is painfully slow unoptimized, so even debug builds optimize
# a little. Use --release for the images and the TIME lines.
opt-level = 1
